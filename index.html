<!DOCTYPE html>
<html lang="en">
   <head>
      <meta charset="UTF-8" />
      <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
      <link href="https://cdn.datatables.net/v/bm/jq-3.7.0/dt-2.0.4/af-2.7.0/b-3.0.2/date-1.5.2/fc-5.0.0/fh-4.0.1/rg-1.5.0/sc-2.4.1/sl-2.0.1/datatables.min.css" rel="stylesheet">
      <style>
         @import "./src/style.css";
      </style>
      <title>JSDev</title>
   </head>
   <body>
   <div  id="header"></div>
<div class="container-fluid">
  <div class="row">
      <div class="container-fluid bg-whit col-10 flex">
         <div class="row">
            <div class="col-3">
               <ul class="list-inline">
                  <li class="list-inline-item"><strong>Quote:</strong> <a span href="javascript:runScript('nav|quote');" class="link" id="quoId"></a></li>
                  <div class="clearfix"></div>
                  <li class="list-inline-item"><strong>Location:</strong> <a span href="javascript:runScript('nav|location');" class="link" id="locId"></a></li>
                  <div class="clearfix"></div>
                  <li class="list-inline-item"><strong>Customer:</strong> <a span href="javascript:runScript('nav|customer');" class="link" id="custId"></a></li>
                  <div class="clearfix"></div>
                  <li class="list-inline-item"><strong>Terms:</strong> <a id="terms"></a></li>
                  <div class="clearfix"></div>
                  <li class="list-inline-item"><strong>Pricing:</strong> <a id="pricing"></a></li>
               </ul>
            </div>
            <div class="col-3">
               <ul class="list-inline">
                  <li class="list-inline-item"><strong>FMS: </strong><span id="fms"></span></li>
                  <div class="clearfix"></div>
                  <li class="list-inline-item"><strong>FMS #: </strong><span id="fmsNum"></span></li>
                  <div class="clearfix"></div>
                  <li class="list-inline-item"><strong>FMS Status: </strong><span id="fmsStatus"></span></li>
                  <div class="clearfix"></div>
                  <li class="list-inline-item"><strong>PO: </strong><span id="po"></span></li>
                  <div class="clearfix"></div>
               </ul>
            </div>
            <div class="col-4">
               <ul class="list-inline">
                  <li class="list-inline-item"><strong>Order Status: </strong><span id="status"></span></li>
                  <div class="clearfix"></div>
                  <li class="list-inline-item"><strong>Order Date: </strong><span id="dateOrder"></span></li>
                  <div class="clearfix"></div>
                  <li class="list-inline-item"><strong>Ship Date: </strong><span id="dateShip"></span></li>
                  <div class="clearfix"></div>
                  <li class="list-inline-item"><strong>Inv Date: </strong><span id="dateInv"></span></li>
                  <div class="clearfix"></div>
               </ul>
            </div>
            <ul class="list-inline pl-3">
               <li class="list-inline-item"><strong>Assigned MPs:</strong> <span id="mps"></span></li>
            </ul>
      <div class="container-fluid bg-whit col-12 flex">
        <div class="row">
        <ul class="list-inline col-6">
          <li class="list-inline-item"><strong>Addresses</strong><button id="btnAddress" class="btn btn-primary btnAddress"></button></li>
          <div class="clearfix"></div>
          <li class="list-inline-item" id="billingAdd"></li>
          <div class="clearfix"></div>
          <li class="list-inline-item" id="shippingAdd"></li>
          <div class="clearfix"></div>
          <li class="list-inline-item" id="installAdd"></li>
       </ul>
       <ul class="list-inline col-6">
        <li class="list-inline-item"><strong>Contacts</strong><button id="btnContactEdit" class="btn btn-primary btnAddress"></button></li>
        <div id="all_contact" class="contactContainer"/>
     </ul>
    </div>
   </div>
</div>
</div>
<div id="sidebarMenu" class="bg-whit col-2 d-md-block sidebar collapse">
   <button id="btnStatus" type="button" class="btn btn-primary col-12">Change Status</button>
   <button id="btnEmail" type="button" class="btn btn-primary col-12">Email MPs</button>
   <button id="btnShipping" type="button" class="btn btn-primary col-12">Shipping Details</button>
   <button id="btnVersions" type="button" class="btn btn-primary col-12">Order Versions</button>
   <button id="btnForms" type="button" class="btn btn-primary col-12">Forms</button>
   <button id="btnNotes" type="button" class="btn btn-primary col-12">System Notes</button>
   <button id="btnSplitMerge" type="button" class="btn btn-primary col-12">Split/Merge</button>
   <button id="btnInvoice" type="button" class="btn btn-primary col-12">Invoice</button>
   <button id="btnDelete" type="button" class="btn btn-danger col-12">Delete</button>
</div>
</div>

<div class="container-fluid bg-whit col-12 flex bottomPadding">
   <div class="row">
      <div class="col-6 noteLabel">
<div class="floatLeft"><strong>Unpublished Notes</strong><button id="btnUnNotes" class="btn btn-primary btnLineEdit"></button></div><div id="unNotes"></div>
      </div>
      <div class="col-6">
<div class="floatLeft"><strong>Notes</strong><button id="btnComment" class="btn btn-primary btnLineEdit"></button></div><div id="comments"></div>
</div></div></div>
<div class="clearfix"></div>

<div class="floatLeft"><strong>Line Items</strong></div><button id="btnLineEdit" class="btn btn-primary btnLineEdit"></button>
<table id="table" class="row-border" style="width:100%">
   </div>
   <div id="totals"></div>


      <script src="https://cdn.jsdelivr.net/npm/popper.js@1.14.7/dist/umd/popper.min.js" integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1" crossorigin="anonymous"></script>
      <script src="https://cdn.datatables.net/v/bm/jq-3.7.0/dt-2.0.4/af-2.7.0/b-3.0.2/date-1.5.2/fc-5.0.0/fh-4.0.1/rg-1.5.0/sc-2.4.1/sl-2.0.1/datatables.min.js"></script>
<script type="module">
         import "./src/index.js";
      </script>  
        </body>
</html>
